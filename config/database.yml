default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  host: localhost
  port: 5432
  database: development
  username: contur
  password: contura_123

test:
  <<: *default
  host: localhost
  port: 5432
  database: test
  username: contur
  password: contura_123

production:
  <<: *default
  host: <%= ENV["DB_HOST"] || "127.0.0.1" %>
  port: <%= ENV["DB_PORT"] || 5432 %>
  database: <%= ENV["DB_NAME"] || "production" %>
  username: <%= ENV["DB_USERNAME"] %>
  password: <%= ENV["DB_PASSWORD"] %>