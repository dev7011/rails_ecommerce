services:
  - type: web
    name: rails-ecommerce
    runtime: ruby
    plan: free
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: RAILS_MASTER_KEY
        sync: false

      - key: WEB_CONCURRENCY
        value: "2"